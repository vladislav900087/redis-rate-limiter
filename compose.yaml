services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
  api:
   build: .
   ports:
     - "8000:8000"
   environment:
     REDIS_URL: "redis://redis:6379/0"
   depends_on:
     redis:
       condition: service_healthy
   healthcheck:
     test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
     interval: 10s
     timeout: 5s
     retries: 5
     start_period: 10s





volumes:
  redis_data: